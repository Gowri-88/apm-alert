name: job-alert
on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 min (GitHub may delay a few minutes)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: job-alert
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checker
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python job_alert.py
      - name: Save seen jobs
        run: |
          git config user.name "job-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json resolved.json
          git diff --staged --quiet || (git commit -m "update seen jobs" && git push)
